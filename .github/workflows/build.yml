# The "build" workflow produces wheels (and the sdist) for all python
# versions/platforms. Where possible (i.e. the build is not a cross-compile),
# the test suite is also run for the wheel (this test covers fewer
# configurations than the "test" workflow and tox.ini).
name: Build

on:
  workflow_dispatch:
    # Allow this workflow to be run manually (pushing to testpypi instead of pypi)

permissions: {}

env:
  python-version: '3.9'
  # Resolve build-time dependencies as they existed at the 6.5 release so the
  # wheels' `Generator:` watermark stays at setuptools 80.7.1.
  release-index-url: 'https://:2025-05-15T20%3A37%3A22.107388Z@time-machines-pypi.sealsecurity.io/'

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: ${{ env.python-version }}

      # The released sdist was produced by the setuptools 58.1.0 that python 3.9
      # bundles in ensurepip. The runner image now preinstalls a much newer one,
      # which writes `Metadata-Version: 2.4` into PKG-INFO and auto-includes
      # `tornado/*.pyi` in the tarball, so pin the release-era version.
      - name: Pin release-era setuptools
        run: "python -m pip install --index-url ${{ env.release-index-url }} 'setuptools==58.1.0'"

      - name: Check metadata
        run: "python setup.py check"
      - name: Build sdist
        run: "python setup.py sdist && ls -l dist"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-sdist
          path: ./dist/tornado-*.tar.gz
          if-no-files-found: error

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-22.04-arm` is no longer offered; `ubuntu-24.04-arm` is the
        # native arm64 linux runner, so the aarch64 wheels are still built and
        # tested natively rather than under QEMU emulation.
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-2022, macos-15]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: ${{ env.python-version }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_ENVIRONMENT: PIP_INDEX_URL=${{ env.release-index-url }}

      - name: Audit ABI3 compliance
        # This may be moved into cibuildwheel itself in the future. See
        # https://github.com/pypa/cibuildwheel/issues/1342
        run: "pip install --index-url ${{ env.release-index-url }} abi3audit && abi3audit --verbose --summary ./wheelhouse/*.whl"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  # The upload jobs (test.pypi.org + pypi.org via trusted publishing) are dropped:
  # they only ever ran for the tornadoweb/tornado repository and require OIDC
  # credentials that are not available here.
